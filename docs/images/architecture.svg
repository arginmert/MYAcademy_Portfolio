<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d5dfc"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="20" fill="#f8f7ff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="24" font-weight="800" fill="#1e1b4b">Uygulama Mimarisi</text>
    <text x="600" y="74" text-anchor="middle" font-size="15" fill="#6b7280">Ziyaretçi arayüzü ve Admin paneli aynı EF Core DbContext üzerinden tek veritabanını kullanır</text>

    <!-- Visitor UI -->
    <rect x="40" y="110" width="330" height="300" rx="18" fill="#ffffff" stroke="#e3e0f7" stroke-width="2"/>
    <rect x="40" y="110" width="330" height="54" rx="18" fill="#38bdf8"/>
    <rect x="40" y="140" width="330" height="24" fill="#38bdf8"/>
    <text x="205" y="144" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Ziyaretçi Arayüzü (UI)</text>
    <g font-size="14" fill="#374151">
      <text x="64" y="194" font-weight="700" fill="#0c4a6e">DefaultController → Index</text>
      <text x="64" y="222">ViewComponent'ler:</text>
      <text x="80" y="246">• HeroSection · Navbar (CV indir)</text>
      <text x="80" y="270">• About · Education · Experience</text>
      <text x="80" y="294">• Skill (yüzde barları)</text>
      <text x="80" y="318">• Project (kart + kategori)</text>
      <text x="80" y="342">• Contact formu · SocialMedia</text>
      <text x="80" y="366">• Footer</text>
    </g>

    <!-- Admin -->
    <rect x="830" y="110" width="330" height="300" rx="18" fill="#ffffff" stroke="#e3e0f7" stroke-width="2"/>
    <rect x="830" y="110" width="330" height="54" rx="18" fill="#6d5dfc"/>
    <rect x="830" y="140" width="330" height="24" fill="#6d5dfc"/>
    <text x="995" y="144" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Admin Area (/Admin)</text>
    <g font-size="14" fill="#374151">
      <text x="854" y="194" font-weight="700" fill="#3b2fa8">Dashboard · DashboardViewModel</text>
      <text x="854" y="222">CRUD Controller'ları:</text>
      <text x="870" y="246">• Hero · About · Contact · Settings</text>
      <text x="870" y="270">• Education · Experience · Skill</text>
      <text x="870" y="294">• Project · Categories</text>
      <text x="870" y="318">• Message (okundu / sil)</text>
      <text x="870" y="342">• SocialMedia (aktif / pasif)</text>
      <text x="870" y="366">• Cv (PDF yükleme)</text>
    </g>

    <!-- DbContext -->
    <rect x="450" y="150" width="300" height="110" rx="18" fill="#1e1b4b"/>
    <text x="600" y="194" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">PortfolioContext</text>
    <text x="600" y="220" text-anchor="middle" font-size="14" fill="#c7c2ff">EF Core · Code First · Migrations</text>
    <text x="600" y="242" text-anchor="middle" font-size="13" fill="#a5b4fc">Include · Where · Count · GroupBy · Take</text>

    <!-- SQL -->
    <path d="M500,322 a100,18 0 0,0 200,0 v58 a100,18 0 0,1 -200,0 z" fill="#ffffff" stroke="#6d5dfc" stroke-width="2"/>
    <ellipse cx="600" cy="322" rx="100" ry="18" fill="#ede9fe" stroke="#6d5dfc" stroke-width="2"/>
    <text x="600" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b4b">SQL Server</text>
    <text x="600" y="390" text-anchor="middle" font-size="12" fill="#6b7280">PortfolioDbNight</text>

    <!-- arrows -->
    <line x1="370" y1="205" x2="446" y2="205" stroke="#6d5dfc" stroke-width="2.5" marker-end="url(#arr)"/>
    <line x1="830" y1="205" x2="754" y2="205" stroke="#6d5dfc" stroke-width="2.5" marker-end="url(#arr)"/>
    <line x1="600" y1="260" x2="600" y2="300" stroke="#6d5dfc" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="408" y="196" text-anchor="middle" font-size="12" fill="#6b7280">okur</text>
    <text x="792" y="196" text-anchor="middle" font-size="12" fill="#6b7280">yazar</text>

    <!-- relation & wwwroot strip -->
    <rect x="40" y="440" width="540" height="90" rx="16" fill="#ffffff" stroke="#e3e0f7" stroke-width="2"/>
    <text x="64" y="472" font-size="15" font-weight="700" fill="#1e1b4b">İlişkili tablo (1 → N)</text>
    <rect x="64" y="486" width="150" height="32" rx="8" fill="#ede9fe"/>
    <text x="139" y="507" text-anchor="middle" font-size="14" font-weight="600" fill="#3b2fa8">Category</text>
    <line x1="214" y1="502" x2="330" y2="502" stroke="#6d5dfc" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="272" y="494" text-anchor="middle" font-size="12" fill="#6b7280">1 — N</text>
    <rect x="336" y="486" width="150" height="32" rx="8" fill="#ede9fe"/>
    <text x="411" y="507" text-anchor="middle" font-size="14" font-weight="600" fill="#3b2fa8">Project</text>
    <text x="500" y="507" font-size="12" fill="#6b7280">FK: CategoryId</text>

    <rect x="620" y="440" width="540" height="90" rx="16" fill="#ffffff" stroke="#e3e0f7" stroke-width="2"/>
    <text x="644" y="472" font-size="15" font-weight="700" fill="#1e1b4b">wwwroot — dosya yönetimi (IFormFile)</text>
    <text x="644" y="500" font-size="14" fill="#374151">/files/cv.pdf  → yalnızca PDF, en fazla 5 MB</text>
    <text x="644" y="520" font-size="14" fill="#374151">/images/hero/{Guid}.jpg  → JPG/PNG/WEBP, en fazla 3 MB</text>
  </g>
</svg>
